<!doctype html>
<html lang="en">
  <head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>

      <section class="game-area" aria-live="polite">
        <div class="scoreboard">
          <div>Player: <span id="player-score">0</span></div>
          <div>Computer: <span id="computer-score">0</span></div>
        </div>

        <div class="choices" role="group" aria-label="Game choices">
          <button class="choice" onclick="playRound('rock')">✊ Rock</button>
          <button class="choice" onclick="playRound('paper')">✋ Paper</button>
          <button class="choice" onclick="playRound('scissors')">✌️ Scissors</button>
        </div>

        <div class="result" id="result">Make your move</div>
      </section>

      <footer class="site-footer">Tip: Click a choice to play once.</footer>
    </main>

  <script src="script.js"></script>
  </body>
</html>
