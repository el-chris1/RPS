<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rock Paper Scissors — Starter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-3V5gk1zqgq6Y6V/1P5vF1Z1Gz6sQJZq3n1F5F5Qk1Q9E2nG1Z6Y" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-dark text-light">
    <main class="app-root container py-5 d-flex flex-column align-items-center">
      <div class="w-100" style="max-width:720px;">
        <header class="site-header text-center mb-4">
          <h1 class="mb-1">Rock · Paper · Scissors</h1>
          <p class="subtitle text-muted">A tiny starter template</p>
        </header>

        <div class="d-flex justify-content-center mb-3">
          <a href="index.html" class="start-btn btn btn-lg btn-primary">Start Game</a>
        </div>

        <div class="result text-center" id="result">Make your move</div>

        <footer class="site-footer text-center mt-4">Tip: Click a choice to play once.</footer>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-7y7VnX1Hq8+f1Gv1J5Y" crossorigin="anonymous"></script>
  </body>
</html>
